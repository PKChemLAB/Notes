site_name: "CPK's Notes"
site_url: https://pkchemlab.github.io/Notes/
docs_dir: docs

repo_name: pkchemlab/Notes
repo_url: https://github.com/pkchemlab/Notes
theme:
  name: material
  language: zh
  favicon: assets/favicon.png
  logo: assets/logo.png
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式

  features:
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - glightbox
  - statistics:
      words_per_minute: 200

nav:
  - 首页: index.md

  - 结构Ⅱ:光谱学:
      - 课程主页: structure-spectroscopy/index.md
      - 光与分子的相互作用: structure-spectroscopy/chapter-1.md
      - 原子结构和原子光谱: structure-spectroscopy/chapter-2.md
      - 转动光谱: structure-spectroscopy/chapter-3.md
      - 振动光谱：双原子分子: structure-spectroscopy/chapter-4.md
      - 振动光谱：多原子分子: structure-spectroscopy/chapter-5.md
      - 分子电子光谱: structure-spectroscopy/chapter-6.md

  - 结构Ⅲ:固体物理:
      - 课程主页: solid-state-physics/index.md
      - 晶体学基础: solid-state-physics/chapter-1.md
      - 晶体的 X 射线衍射: solid-state-physics/chapter-2.md
      - 固体能带理论基础: solid-state-physics/chapter-3.md
      - 固体光谱基础: solid-state-physics/chapter-4.md
      - 金属晶体和离子晶体: solid-state-physics/chapter-5.md

  - 物理化学I:
      - 课程主页: physical-chem-1/index.md
      - Databases: physical-chem-1/database.md
      - 能量与能量量子化: physical-chem-1/chapter-1.md
      - 从单原子分子到多原子：熵与温度: physical-chem-1/chapter-2.md
      - 分子结构与宏观测量: physical-chem-1/chapter-3.md
      - 热力学基础: physical-chem-1/chapter-4.md
      - 可逆过程热力学与第二定律: physical-chem-1/chapter-5.md

  - 物理化学II:
      - 课程主页: physical-chem-2/index.md
      - 分子间相互作用: physical-chem-2/chapter-7.md
      - 纯物质体相性质: physical-chem-2/chapter-8.md
      - 溶液的基本性质: physical-chem-2/chapter-9.md
      - 溶液与多相混合物: physical-chem-2/chapter-10.md

  - 数据结构基础:
      - 课程主页: data-structures/index.md
      - Algorithm Analysis: data-structures/ds01.md
      - Lists, Stacks, and Queues: data-structures/ds02.md
      - Trees: data-structures/ds03.md
      - Heaps and Priority Queues: data-structures/ds04.md
      - Segment Trees: data-structures/ds05.md


  - 信息理论:
    - 总览: information-theory/index.md
    - 信息度量与熵: information-theory/L1.md


  - 计算化学导论:
      - 课程主页: intro-computational-chem/index.md
      - 引例: intro-computational-chem/first-example.md
      - 蒙特卡洛方法: intro-computational-chem/montecarlo.md

  - Papers:
    - 总览: papers/index.md
    - 气液界面合成: papers/26.3.15.md


copyright: Copyright &copy; 2026 Peikai Chen

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css?v=2026.09.21.0030
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css
